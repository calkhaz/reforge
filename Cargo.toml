[package]
name = "reforge"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.80"
ash-window = "0.13.0"
ash = "0.38.0"
raw-window-handle = "0.6.2"
winit = "0.30.5"
shaderc = "0.8"
gpu-allocator = "0.27.0"
clap = { version = "4.2.5", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
pyo3 = { version = "0.20.3", features = ["auto-initialize"] }
num-traits = "0.2.18"
spirq = "1.2.2"
bitflags = "2.6.0"
egui-winit = "0.29.1"
egui = "0.29.1"

[dev-dependencies]
image-compare = "0.4.1"
image = "0.25.2"
